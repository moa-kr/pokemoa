<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>GEOCHECK</title>
<style>body{font:13px/1.5 ui-monospace,monospace;padding:16px}td,th{border:1px solid #ddd;padding:4px 6px;font-size:12px}</style>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=63b35e228dacdcc4d0e31f83a7738f22&libraries=services&autoload=false"></script>
</head>
<body>
<p>좌표 확인용 임시 페이지입니다(색인 제외). 결과가 아래 표에 채워집니다.</p>
<pre id="out">RUNNING</pre>
<table id="tbl"><thead><tr><th>id</th><th>query</th><th>lat</th><th>lng</th><th>road</th><th>place</th></tr></thead><tbody></tbody></table>
<script>
(function () {
  var SHOPS = [
    ["용산", "pokemon 카드샵 용산 아이파크몰"],
    ["역삼", "카드냥 역삼"],
    ["목동", "카드챔프 목동"],
    ["인천", "카드팝 인천"],
    ["수원", "카드플래닛 수원"],
    ["평택", "카드홀릭 평택"],
    ["구리", "TCG라인 구리"],
    ["일산", "카드필드 일산"],
    ["원주", "카드스페이스 원주"],
    ["강릉", "카드웨이브 강릉"],
    ["천안", "카드프라임 천안"],
    ["대전", "카드롤 대전"],
    ["대구", "트레이너 스쿨 대구"],
    ["울산", "TCG팩토리 울산"],
    ["부산", "카드베이스 부산"],
    ["광주", "화성스토어 광주"],
    ["toysrus-eunpyeong", "토이저러스 은평점"],
    ["toysrus-jamsil", "토이저러스 제타플렉스"],
    ["toysrus-junggye", "토이저러스 중계점"],
    ["grand-eunpyeong", "롯데마트 그랑그로서리 은평점"]
  ];
  var out = document.getElementById("out");
  var tbody = document.querySelector("#tbl tbody");
  var rows = [];
  var direct = { state: "pending" };

  function geocode(q) {
    return new Promise(function (resolve) {
      var places = new kakao.maps.services.Places();
      places.keywordSearch(q, function (data, status) {
        if (status !== kakao.maps.services.Status.OK || !data || !data.length) { resolve(null); return; }
        var hit = data[0];
        resolve({ lat: Number(hit.y), lng: Number(hit.x), road: hit.road_address_name || "", addr: hit.address_name || "", place: hit.place_name || "" });
      }, { size: 3, sort: kakao.maps.services.SortBy.ACCURACY });
    });
  }

  function tryDirect() {
    var url = "https://company.lottemart.com/mobiledowa/inc/asp/search_market_list.asp?p_area=" + encodeURIComponent("서울") + "&p_type=1";
    var t0 = Date.now();
    return fetch(url, { mode: "cors", credentials: "omit", cache: "no-store" })
      .then(function (res) {
        return res.text().then(function (text) {
          direct = { state: "ok", status: res.status, ms: Date.now() - t0, len: text.length, sample: text.slice(0, 120), acao: res.headers.get("access-control-allow-origin") };
        });
      })
      .catch(function (err) {
        direct = { state: "blocked", ms: Date.now() - t0, error: String(err && err.message || err) };
      });
  }

  kakao.maps.load(function () {
    var chain = Promise.resolve();
    SHOPS.forEach(function (item) {
      chain = chain.then(function () {
        return geocode(item[1]).then(function (hit) {
          var row = { id: item[0], q: item[1], hit: hit };
          rows.push(row);
          var tr = document.createElement("tr");
          tr.innerHTML = "<td>" + row.id + "</td><td>" + row.q + "</td><td>" + (hit ? hit.lat : "") + "</td><td>" + (hit ? hit.lng : "") + "</td><td>" + (hit ? hit.road : "") + "</td><td>" + (hit ? hit.place : "") + "</td>";
          tbody.appendChild(tr);
        });
      });
    });
    chain.then(tryDirect).then(function () {
      out.textContent = JSON.stringify({ direct: direct, rows: rows }, null, 1);
      document.title = "DONE";
    });
  });
})();
</script>
</body>
</html>
