<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>GEOCHECK3</title>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=63b35e228dacdcc4d0e31f83a7738f22&libraries=services,clusterer,drawing&autoload=false"></script>
</head>
<body>
<p>좌표 확인용 임시 페이지 3(색인 제외).</p>
<pre id="out">RUNNING</pre>
<script>
(function () {
  var SHOPS = [
    ["용산", "서울특별시 용산구 한강대로23길 55 아이파크몰 리빙파크 8층", "pokemon 카드샵 용산 아이파크몰"],
    ["역삼", "서울특별시 강남구 논현로77길 9 태원빌딩 4층", "카드냥 역삼"],
    ["목동", "서울특별시 양천구 오목로 194 정우빌딩 2층", "카드챔프 목동"],
    ["인천", "인천광역시 부평구 부평문화로66번길 21 4층", "카드팝 인천"],
    ["수원", "경기도 수원시 영통구 청명로 73-1 2층", "카드플래닛 수원"],
    ["평택", "경기도 평택시 평택2로 16 3층", "카드홀릭 평택"],
    ["구리", "경기도 구리시 장자대로86번길 32 2층", "TCG라인 구리"],
    ["일산", "경기도 고양시 일산서구 일중로15번길 23 2층", "카드필드 일산"],
    ["원주", "강원도 원주시 능라동길 42 602호", "카드스페이스 원주"],
    ["강릉", "강원도 강릉시 솔올로 40 3층", "카드웨이브 강릉"],
    ["천안", "충청남도 천안시 서북구 백석로 130 2층", "카드프라임 천안"],
    ["대전", "대전광역시 서구 둔산로 72 등오빌딩 5층", "카드롤 대전"],
    ["대구", "대구광역시 달서구 성당동 488-1 2층", "트레이너 스쿨 대구"],
    ["울산", "울산광역시 중구 번영로 454-1 1층", "TCG팩토리 울산"],
    ["부산", "부산광역시 동래구 명륜로129번길 54 4층", "카드베이스 부산"],
    ["광주", "광주광역시 동구 중앙로160번길 22 2층", "화성스토어 광주"]
  ];
  var state = { done: 0, total: SHOPS.length, rows: [], errors: [] };
  window.__geo = state;
  var out = document.getElementById("out");
  window.onerror = function (msg, src, line) { state.errors.push(String(msg) + " @" + line); flush(); };
  function flush() {
    out.textContent = JSON.stringify(state);
    document.title = state.done >= state.total ? "DONE3" : "RUNNING";
  }
  function keyword(q) {
    return new Promise(function (resolve) {
      try {
        new kakao.maps.services.Places().keywordSearch(q, function (data, status) {
          if (status !== kakao.maps.services.Status.OK || !data || !data.length) return resolve(null);
          resolve({ lat: Number(data[0].y), lng: Number(data[0].x), road: data[0].road_address_name || "", place: data[0].place_name || "" });
        }, { size: 3, sort: kakao.maps.services.SortBy.ACCURACY });
      } catch (err) { state.errors.push("kw:" + q + ":" + err.message); resolve(null); }
    });
  }
  function address(addr) {
    return new Promise(function (resolve) {
      try {
        new kakao.maps.services.Geocoder().addressSearch(addr, function (data, status) {
          if (status !== kakao.maps.services.Status.OK || !data || !data.length) return resolve(null);
          var hit = data[0];
          resolve({ lat: Number(hit.y), lng: Number(hit.x), road: hit.road_address ? hit.road_address.address_name : "" });
        }, { size: 3 });
      } catch (err) { state.errors.push("addr:" + addr + ":" + err.message); resolve(null); }
    });
  }
  function one(s) {
    return Promise.all([address(s[1]), keyword(s[2])]).then(function (res) {
      state.rows.push({ id: s[0], geocoder: res[0], keyword: res[1] });
      state.done += 1;
      flush();
    });
  }
  function run(i) {
    if (i >= SHOPS.length) { flush(); return; }
    one(SHOPS[i]).then(function () { run(i + 1); });
  }
  if (!window.kakao || !kakao.maps) { state.errors.push("no kakao"); flush(); return; }
  kakao.maps.load(function () { run(0); });
})();
</script>
</body>
</html>
